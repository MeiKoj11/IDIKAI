<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grammar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-topbar" class="app-topbar">
    <button type="button" id="topbar-hamburger" class="topbar-hamburger" aria-label="Menu" aria-haspopup="true">
      <span></span><span></span><span></span>
    </button>
    <span id="topbar-lang-label" class="topbar-lang-label"></span>
    <div id="topbar-menu" class="topbar-menu" hidden>
      <div class="topbar-menu-heading">Change language</div>
      <button type="button" class="topbar-lang-option" data-lang="es">Spanish</button>
      <button type="button" class="topbar-lang-option" data-lang="ja">Japanese</button>
    </div>
    <button type="button" id="topbar-notifications" class="topbar-notifications" aria-label="Notifications" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"></rect><path d="M3 6.5l9 6.5 9-6.5"></path></svg>
    </button>
    <!-- A quick-glance to-do list — just a small icon here next to
         Notifications, opening the same panel that used to float over
         the page as a big red button. -->
    <button type="button" id="hub-todo-toggle" class="topbar-todo" aria-label="To-do list" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>
      <span id="hub-todo-toggle-count" class="hub-todo-toggle-count" hidden></span>
    </button>
    <a href="welcome.html" id="topbar-home" class="topbar-home" aria-label="Language home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    </a>
    <div id="topbar-notifications-menu" class="topbar-menu topbar-notifications-menu" hidden>
      <div class="topbar-menu-heading">Notifications</div>
      <p class="topbar-notifications-empty">Coming soon — once a teacher connection exists, updates will show up here.</p>
    </div>
    <div id="hub-todo-panel" class="hub-todo-panel" hidden>
      <div id="hub-todo-header" class="hub-todo-header">
        <span class="hub-todo-title">To-do list</span>
        <button type="button" id="hub-todo-close" class="hub-todo-close" aria-label="Close">×</button>
      </div>
      <form id="hub-todo-add-form" class="hub-todo-add-form">
        <input type="text" id="hub-todo-add-input" placeholder="Add a task…" autocomplete="off" />
        <select id="hub-todo-folder-select" class="hub-todo-folder-select" aria-label="Folder">
          <option value="">No folder</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <div id="hub-todo-groups" class="hub-todo-groups"></div>
      <label class="hub-todo-show-completed">
        <input type="checkbox" id="hub-todo-show-completed" />
        Show completed
      </label>
    </div>
  </div>
  <div id="app-tab-strip" class="app-tab-strip">
    <div id="app-tab-strip-tabs" class="app-tab-strip-tabs"></div>
    <div class="app-tab-strip-add">
      <button type="button" id="app-tab-plus" class="tab-bar-plus-btn" title="Open another section in a new tab">+</button>
      <div id="app-tab-picker-panel" class="app-tab-picker-panel" hidden>
        <select id="app-tab-section-select">
          <option value="" disabled selected>Which section?</option>
          <option value="vocab">Vocab Bank</option>
          <option value="grammar">Grammar</option>
          <option value="writing">Writing</option>
          <option value="speaking">Speaking</option>
          <option value="reading">Reading</option>
          <option value="personal-hub">Personal Hub</option>
          <option value="listening">Listening</option>
        </select>
        <select id="app-tab-unit-select" hidden>
          <option value="" disabled selected>Which one?</option>
        </select>
        <button type="button" id="app-tab-open-btn" class="secondary" hidden>Open</button>
        <button type="button" id="app-tab-picker-cancel" class="secondary">Cancel</button>
      </div>
    </div>
  </div>
  <header class="app-header" id="grammar-header">
    <a href="index.html" class="back-link" id="grammar-back-link">&larr; Back</a>
    <h1 id="grammar-heading">Grammar</h1>
  </header>
  <main>
    <ul id="grammar-theme-list" class="theme-list"></ul>
  </main>
  <script src="js/topbar.js"></script>
  <script src="js/app-tabs.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/hub-tasks.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/grammar-concepts.js"></script>
  <script src="js/grammar-app.js"></script>
</body>
</html>
